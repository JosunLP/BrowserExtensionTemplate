<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" />
    <title>{{BET}}</title>
  </head>
  <body class="extension-body">
    <noscript>
      <strong
        >We're sorry but {{BET}} doesn't work properly without JavaScript enabled. Please enable it
        to continue.</strong
      >
    </noscript>
    <div id="app" class="extension-shell">
      <header class="app-topbar">
        <div class="brand-mark">
          <img src="./icons/icon128.png" alt="" class="logo" />
        </div>
        <div class="brand-copy">
          <span class="eyebrow">{{BET}}</span>
          <span class="brand-title">Quick view</span>
        </div>
        <span class="status-pill"><span class="status-dot"></span>Ready</span>
      </header>
      <div id="content"></div>
    </div>
    <footer>
      <script type="module" src="./app.js"></script>
    </footer>
  </body>
</html>
